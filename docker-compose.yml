version: '3.8'
  
services:
  simoeshomepage:
    container_name: simoeshomepage
    hostname: simoeshomepage
    restart: always
    build: .
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn simoes_tecnologia.wsgi:application --bind 0.0.0.0:8000"
    environment:
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY:-}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-}
    volumes:
      - ./:/code
    ports:
      - "8181:8000"
